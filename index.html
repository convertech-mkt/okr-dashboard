<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Convertech - Okr Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;700&family=Rubik:wght@500;600&display=swap">
<style>
:root{--bg:#f4f5f7;--panel:#fff;--text:#14171c;--muted:#6b7280;--line:#dde0e6;--accent:#2563eb;--on:#fff;--hh:84px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--panel:#181b21;--text:#eceef2;--muted:#8d95a3;--line:#2a2e37}}
:root[data-theme="dark"]{--bg:#0f1115;--panel:#181b21;--text:#eceef2;--muted:#8d95a3;--line:#2a2e37}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--hh))}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Arial Rounded MT Bold","Arial Rounded MT",Arial,sans-serif}
header{position:fixed;top:0;left:0;right:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
padding:env(safe-area-inset-top,0px) 28px 0;height:calc(var(--hh) + env(safe-area-inset-top,0px));display:flex;align-items:center;justify-content:space-between}
.brand{font-family:"Prompt",Arial,sans-serif;font-weight:300;font-size:32px;letter-spacing:.2px;white-space:nowrap}
.brand b{font-weight:700}
.brand span{color:var(--accent)}
.btn{font:inherit;font-size:14px;background:var(--panel);color:var(--text);border:1px solid var(--line);padding:10px 16px;cursor:pointer;border-radius:0}
.btn:hover{border-color:var(--accent)}
main{max-width:1100px;margin:0 auto;padding:calc(var(--hh) + env(safe-area-inset-top,0px) + 32px) 20px 48px}
.client{display:flex;justify-content:center;margin-bottom:8px}
#client{font-family:"Rubik",Arial,sans-serif;font-weight:600;font-size:clamp(34px,6.5vw,60px);text-align:center;background:transparent;color:var(--text);
border:0;border-bottom:2px dashed var(--line);width:min(100%,640px);padding:6px 8px;outline:none;border-radius:0}
#client:focus{border-bottom-color:var(--accent)}
.sub{text-align:center;color:var(--muted);font-size:13px;margin:0 0 28px}
.bar{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;margin-bottom:20px}
.seg{display:inline-flex;border:1px solid var(--line);background:var(--panel);max-width:100%}
.seg button{font:inherit;font-size:14px;background:none;border:0;color:var(--muted);padding:11px 18px;cursor:pointer;border-radius:0}
.seg button.on{background:var(--accent);color:var(--on)}
.hint{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);padding:12px 16px;font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card.key{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.top{background:var(--accent);color:var(--on);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.top h3{margin:0;font-size:15px;font-weight:700}
.tag{font-size:11px;opacity:.85;white-space:nowrap}
.body{padding:14px 16px 16px;flex:1;display:flex;flex-direction:column;gap:6px}
.val{display:flex;align-items:baseline;gap:6px}
.val input{font:inherit;font-weight:400;font-size:26px;color:var(--text);background:transparent;border:0;border-bottom:1px solid transparent;width:100%;min-width:0;padding:2px 0;outline:none;border-radius:0}
.val input:not([readonly]){border-bottom-color:var(--line)}
.val input:not([readonly]):focus{border-bottom-color:var(--accent)}
.val input[readonly]{cursor:default}
.val .u{color:var(--muted);font-size:15px}
.desc{font-size:12px;color:var(--muted);line-height:1.4}
.tax{display:flex;align-items:center;gap:10px;margin-top:6px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.sw{position:relative;width:40px;height:22px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;background:var(--line);border-radius:22px;transition:.2s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+i{background:var(--accent)}
.sw input:checked+i::after{transform:translateX(18px)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:.2s;z-index:30}
.scrim.open{opacity:1;pointer-events:auto}
aside{position:fixed;top:0;right:0;bottom:0;width:min(340px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:40;
transform:translateX(100%);transition:transform .25s;padding:calc(env(safe-area-inset-top,0px) + 20px) 20px calc(env(safe-area-inset-bottom,0px) + 20px);overflow-y:auto}
aside.open{transform:none}
aside .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
aside h2{margin:0;font-size:18px;font-family:"Rubik",Arial,sans-serif}
aside h4{margin:24px 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.cols{display:flex;flex-wrap:wrap;gap:10px}
.cols button{width:40px;height:40px;border:2px solid transparent;cursor:pointer;border-radius:0;outline:1px solid var(--line);outline-offset:0}
.cols button.on{border-color:var(--panel);outline:2px solid var(--text)}
.field{display:flex;align-items:center;gap:8px}
.field input{font:inherit;width:100px;padding:10px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:0}
/* ===== Cor, brilho e animacao ===== */
body{min-height:100vh;position:relative;overflow-x:hidden;transition:background .3s,color .3s}
body::before,body::after{content:"";position:fixed;z-index:-1;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);background:var(--accent);opacity:.3;pointer-events:none;animation:drift 18s ease-in-out infinite alternate}
body::before{top:-25vmax;left:-15vmax}
body::after{bottom:-30vmax;right:-20vmax;opacity:.22;animation-duration:25s;animation-direction:alternate-reverse}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
header{background:color-mix(in srgb,var(--panel) 82%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:2px solid var(--accent);box-shadow:0 6px 28px -6px color-mix(in srgb,var(--accent) 60%,transparent)}
.brand b{color:var(--accent);text-shadow:0 0 18px color-mix(in srgb,var(--accent) 70%,transparent)}
.btn{transition:.2s}
.btn:hover{background:var(--accent);color:var(--on);box-shadow:0 0 18px color-mix(in srgb,var(--accent) 70%,transparent)}
main{max-width:1400px}
#client{border-bottom:2px solid color-mix(in srgb,var(--accent) 50%,var(--line));transition:.25s}
#client:focus{box-shadow:0 10px 24px -14px var(--accent)}
.sub{color:var(--accent);font-weight:700;letter-spacing:.5px;animation:up .6s both}
.seg{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.seg button{transition:.25s}
.seg button:hover{color:var(--text);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.seg button.on{background:linear-gradient(120deg,var(--accent),color-mix(in srgb,var(--accent) 65%,#fff));color:var(--on);box-shadow:0 0 22px -2px color-mix(in srgb,var(--accent) 80%,transparent)}
.hint{background:color-mix(in srgb,var(--accent) 12%,var(--panel));border-color:color-mix(in srgb,var(--accent) 40%,var(--line));border-left-color:var(--accent);color:var(--text);animation:up .6s .1s both}
.grid{grid-template-columns:repeat(7,minmax(150px,1fr));gap:12px;overflow-x:auto;padding:12px 6px 22px;margin:0 -6px;scroll-snap-type:x proximity}
.card{scroll-snap-align:start;min-width:0;position:relative;opacity:0;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 14%,var(--panel)),var(--panel) 70%);border:1px solid color-mix(in srgb,var(--accent) 50%,var(--line));box-shadow:0 8px 22px -10px color-mix(in srgb,var(--accent) 60%,transparent);animation:up .6s cubic-bezier(.2,.8,.2,1) forwards;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-5px);box-shadow:0 16px 36px -10px color-mix(in srgb,var(--accent) 80%,transparent)}
.card.key{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 26px -4px color-mix(in srgb,var(--accent) 70%,transparent);animation:up .6s cubic-bezier(.2,.8,.2,1) forwards,pulse 2.8s ease-in-out .8s infinite}
@keyframes up{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1}}
@keyframes pulse{50%{box-shadow:0 0 0 1px var(--accent),0 0 38px 2px color-mix(in srgb,var(--accent) 80%,transparent)}}
.top{flex-direction:column;align-items:flex-start;justify-content:center;gap:3px;min-height:84px;padding:14px 12px;position:relative;overflow:hidden;background:linear-gradient(120deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#fff))}
.top::after{content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);animation:shine 4.5s ease-in-out infinite}
@keyframes shine{0%,55%{left:-70%}100%{left:140%}}
.top h3{font-size:18px;line-height:1.25;position:relative;z-index:1}
.tag{position:relative;z-index:1;font-size:10px;text-transform:uppercase;letter-spacing:.8px}
.body{padding:12px}
.val input{font-size:clamp(15px,1.35vw,21px)}
.val .u{font-size:13px}
.desc{font-size:11px}
.flash{animation:flash 1s ease-out}
@keyframes flash{0%{color:var(--accent);text-shadow:0 0 16px var(--accent)}100%{text-shadow:0 0 0 transparent}}
.sw input:checked+i{box-shadow:0 0 14px color-mix(in srgb,var(--accent) 80%,transparent)}
.cols button{transition:.2s;box-shadow:0 0 12px -2px currentColor}
.cols button:hover{transform:scale(1.15)}
aside{box-shadow:-10px 0 40px -10px color-mix(in srgb,var(--accent) 50%,transparent);border-left:2px solid var(--accent)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.cols button{border-radius:50%}
#closeCfg{border-radius:999px;padding:10px 20px}
.field input{border-radius:999px;padding:10px 18px}
.exp{width:100%;border-radius:999px;padding:14px 20px;background:linear-gradient(120deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#fff));color:var(--on);border:0;font-weight:700;box-shadow:0 0 22px -4px color-mix(in srgb,var(--accent) 80%,transparent)}
.exp:hover{transform:translateY(-2px);background:linear-gradient(120deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#fff));color:var(--on)}
#expMsg{font-size:12px;color:var(--muted);margin:10px 0 0;min-height:16px}
#openCfg{width:54px;height:54px;padding:0;display:flex;align-items:center;justify-content:center}
#openCfg{background:none;border:0;box-shadow:none;border-radius:0;color:var(--text);transition:color .2s,transform .2s,filter .2s}
#openCfg:hover{background:none;box-shadow:none;color:var(--accent);transform:scale(1.12);filter:drop-shadow(0 0 8px var(--accent))}
.seg{border-radius:999px;padding:4px;gap:4px}
.seg button{border-radius:999px}
@media (max-width:520px){header{padding-left:14px;padding-right:14px}.brand{font-size:22px}#openCfg{width:48px;height:48px}.seg{width:100%}.seg button{flex:1;padding:11px 8px}}

.brand{display:flex;align-items:center;gap:12px}
.bt{white-space:nowrap}
.logo{height:40px;width:auto;flex:none;color:var(--accent);filter:drop-shadow(0 0 10px color-mix(in srgb,var(--accent) 70%,transparent));transition:transform .3s}
.logo:hover{transform:rotate(-6deg) scale(1.08)}
.acts{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px;margin:6px 0 0}
.acts .exp,.tools .exp{width:auto;flex:0 1 240px}
#expMsg,#csvMsg{margin:0;font-size:12px;color:var(--muted)}
.trk{margin-top:56px;animation:up .6s both}
.trkhead{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;margin-bottom:18px}
.trkhead h2{margin:0;font-family:Rubik,Arial,sans-serif;font-size:clamp(24px,3.4vw,34px);padding-left:14px;border-left:6px solid var(--accent)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 6px;border-bottom:2px solid var(--accent)}
.tab{font:inherit;font-size:14px;flex:none;padding:11px 20px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));color:var(--muted);border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));border-bottom:0;border-radius:12px 12px 0 0;cursor:pointer;transition:.2s}
.tab:hover{color:var(--text);background:color-mix(in srgb,var(--accent) 22%,var(--panel))}
.tab.on{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 70%,#fff),var(--accent));color:var(--on);box-shadow:0 -4px 18px -4px color-mix(in srgb,var(--accent) 80%,transparent)}
.tbwrap{background:var(--panel);border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));border-top:0;border-radius:0 0 16px 16px;overflow-x:auto;box-shadow:0 12px 30px -14px color-mix(in srgb,var(--accent) 60%,transparent)}
#tbl{width:100%;border-collapse:separate;border-spacing:0}
#tbl.wk{min-width:560px}
#tbl th,#tbl td{padding:0;border-bottom:1px solid var(--line);text-align:left}
#tbl thead th{padding:14px 16px;background:linear-gradient(120deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#fff));color:var(--on);font-size:15px;text-align:center}
#tbl thead th:first-child{text-align:left;position:sticky;left:0;z-index:1}
#tbl tbody th{padding:14px 16px;font-size:16px;position:sticky;left:0;background:color-mix(in srgb,var(--accent) 8%,var(--panel));white-space:nowrap}
#tbl tbody th small{color:var(--muted);font-weight:400;font-size:12px;margin-left:4px}
#tbl tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--accent) 5%,transparent)}
#tbl tbody tr:hover td{background:color-mix(in srgb,var(--accent) 13%,transparent)}
#tbl tbody tr:last-child>*{border-bottom:0}
#tbl input{font:inherit;font-size:16px;width:100%;min-width:90px;padding:14px 16px;background:transparent;color:var(--text);border:0;outline:none;text-align:center;border-radius:0;transition:.2s}
#tbl input:focus{background:color-mix(in srgb,var(--accent) 16%,transparent);box-shadow:inset 0 -3px 0 var(--accent)}
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:flex-end;margin-top:16px}
.tools .lbl{color:var(--muted);font-size:13px;margin-right:auto}
.cbox{margin-top:32px;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 12%,var(--panel)),var(--panel) 75%);border:1px solid color-mix(in srgb,var(--accent) 50%,var(--line));border-radius:16px;padding:20px;box-shadow:0 8px 22px -10px color-mix(in srgb,var(--accent) 60%,transparent)}
.cbox h3{margin:0 0 14px;font-size:18px;font-family:Rubik,Arial,sans-serif}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{font:inherit;font-size:13px;padding:9px 16px;border-radius:999px;background:var(--panel);color:var(--muted);border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));cursor:pointer;transition:.2s}
.chip:hover{color:var(--text);border-color:var(--accent)}
.chip.on{background:linear-gradient(120deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#fff));color:var(--on);border-color:transparent;box-shadow:0 0 18px -2px color-mix(in srgb,var(--accent) 80%,transparent)}
.svgw{overflow-x:auto}
.svgw svg{display:block;width:100%;min-width:560px;height:auto}
.empty{color:var(--muted);text-align:center;padding:48px 0;margin:0}
.ln{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s ease forwards;filter:drop-shadow(0 0 6px var(--accent))}
.area{opacity:0;animation:fin 1s .6s forwards}
.dot{fill:var(--accent);stroke:var(--panel);stroke-width:2;opacity:0;animation:fin .4s forwards;filter:drop-shadow(0 0 5px var(--accent))}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fin{to{opacity:1}}
.still .ln{animation:none;stroke-dashoffset:0}
.still .area,.still .dot{animation:none;opacity:1}
@media (max-width:520px){.logo{height:26px}.brand{gap:8px}.tools .lbl{width:100%}.tools .exp,.acts .exp{flex:1 1 100%}.cbox{padding:14px}}
@media (max-width:420px){.brand{font-size:17px}}

.c{display:flex;align-items:center;justify-content:center;gap:6px;padding:14px 16px;cursor:text;transition:.2s}
#tbl input{width:3ch;min-width:0;padding:0;text-align:left;background:transparent;box-shadow:none}
#tbl input:focus{background:transparent;box-shadow:none}
.c:focus-within{background:color-mix(in srgb,var(--accent) 16%,transparent);box-shadow:inset 0 -3px 0 var(--accent)}
.c .u{display:none;color:var(--muted);font-size:14px}
.c.has .u{display:inline}
.tip{opacity:0;animation:fin .4s forwards}
.tip text{font-family:"Prompt",Arial,sans-serif;fill:var(--text);font-size:11px;font-weight:300}
.still .tip{animation:none;opacity:1}
@media (max-width:520px){.svgw svg{min-width:640px}}
.svgw text,#ctitle{font-family:"Prompt",Arial,sans-serif}
</style>
</head>
<body>
<header>
  <div class="brand"><svg class="logo" viewBox="0 0 256 208" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M256 0H104C46.5624 0 0 46.5624 0 104C0 161.438 46.5624 208 104 208H136V160H104C73.0721 160 48 134.928 48 104C48 73.0721 73.0721 48 104 48H208C234.51 48 256 26.5097 256 0Z" fill="currentColor"/><path d="M192 56H144V207.998C170.51 207.998 192 186.508 192 159.998V56Z" fill="currentColor"/></svg><div class="bt"><b>Convertech</b> <span>-</span> Okr Dashboard</div></div>
  <button class="btn" id="openCfg" aria-label="Abrir configuracoes"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
</header>

<main>
  <div class="client"><input id="client" type="text" value="Nome do Cliente" aria-label="Nome do cliente" maxlength="60"></div>
  <p class="sub" id="sub"></p>

  <div class="bar">
    <div class="seg" id="modeSeg">
      <button data-mode="result">Meta de Resultado</button>
      <button data-mode="budget">Meta de Orçamento</button>
    </div>
    <div class="seg" id="perSeg">
      <button data-per="month">Mensal</button>
      <button data-per="week">Semanal</button>
    </div>
  </div>

  <div class="hint" id="hint"></div>
  <section class="grid" id="grid"></section>
  <div class="acts">
    <button class="btn exp" id="expPng">Exportar imagem</button>
    <button class="btn exp" id="expPdf">Exportar PDF</button>
    <span id="expMsg"></span>
  </div>

  <section class="trk">
    <div class="trkhead">
      <h2>Acompanhamento</h2>
      <div class="seg" id="divSeg"><button data-div="month">Meses</button><button data-div="week">Semanas</button></div>
    </div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="tbwrap"><table id="tbl"></table></div>
    <div class="tools">
      <span class="lbl">Exportar tabela em .csv (separado por vírgula)</span>
      <button class="btn exp" data-csv="month">CSV por mês</button>
      <button class="btn exp" data-csv="week">CSV por semana</button>
      <span id="csvMsg"></span>
    </div>
    <div class="cbox">
      <h3 id="ctitle"></h3>
      <div class="chips" id="chips"></div>
      <div class="svgw" id="chart"></div>
    </div>
  </section>
</main>

<div class="scrim" id="scrim"></div>
<aside id="cfg" aria-hidden="true">
  <div class="h"><h2>Configurações</h2><button class="btn" id="closeCfg">Fechar</button></div>
  <h4>Tema</h4>
  <div class="seg" id="themeSeg" style="width:100%">
    <button data-theme="light" style="flex:1">Claro</button>
    <button data-theme="dark" style="flex:1">Escuro</button>
  </div>
  <h4>Cor de destaque</h4>
  <div class="cols" id="cols"></div>
  <h4>Imposto</h4>
  <div class="field"><input id="taxRate" type="text" inputmode="decimal" value="10"><span>% sobre o investimento</span></div>
</aside>

<script>
(function(){
var COLORS=[["Verde","#16a34a","#fff"],["Vermelho","#dc2626","#fff"],["Rosa","#ec4899","#fff"],["Roxo","#7c3aed","#fff"],["Azul","#2563eb","#fff"],["Ciano","#06b6d4","#06222a"],["Amarelo","#eab308","#2a2100"]];
var KPI=[
 {k:"result",n:"Resultado",d:"Faturamento total",t:"money",div:1},
 {k:"ticket",n:"Ticket-Medio",d:"Valor medio do servico/produto",t:"money",div:0},
 {k:"sales",n:"Vendas",d:"Numero de vendas esperadas",t:"num",div:1},
 {k:"conv",n:"Conversao",d:"Taxa de conversao de leads em vendas",t:"pct",div:0},
 {k:"leads",n:"Leads",d:"Numero de leads",t:"num",div:1},
 {k:"cpl",n:"Custo por Lead",d:"Custo por cada lead",t:"money",div:0},
 {k:"invest",n:"Valor do Investimento",d:"Valor que deve ser investido pelo cliente",t:"money",div:1}
];
KPI[0].n="Resultado";KPI[1].n="Ticket-M\u00e9dio";KPI[3].n="Convers\u00e3o";KPI[5].n="Custo por Lead";KPI[6].n="Valor do Investimento";
var S={mode:"result",per:"month",client:"Nome do Cliente",taxOn:false,taxRate:10,theme:null,accent:4,v:{},t:{},tab:1,div:"month",chip:"result"};
try{var sv=JSON.parse(localStorage.getItem("convertech_okr")||"null");if(sv)S=Object.assign(S,sv)}catch(e){}
function save(){try{localStorage.setItem("convertech_okr",JSON.stringify(S))}catch(e){}}
var $=function(i){return document.getElementById(i)};
var inputsOf={result:["result","ticket","conv","cpl"],budget:["invest","ticket","conv","leads"]};
function isIn(k){return inputsOf[S.mode].indexOf(k)>-1}
function f(x,t){
 if(x==null||!isFinite(x))return "";
 if(t==="money")return x.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
 return x.toLocaleString("pt-BR",{maximumFractionDigits:t==="pct"?2:1});
}
function parse(s){s=String(s).trim().replace(/\./g,"").replace(",",".");var n=parseFloat(s);return isFinite(n)&&n>=0?n:null}
function factor(k){var d=KPI.filter(function(x){return x.k===k})[0];return S.per==="week"&&d.div?4:1}
function calc(){
 var v=S.v,tx=S.taxOn?1+S.taxRate/100:1,c=v.conv?v.conv/100:0;
 if(S.mode==="result"){
  v.sales=v.result&&v.ticket?v.result/v.ticket:null;
  v.leads=v.sales&&c?v.sales/c:null;
  v.invest=v.leads!=null&&v.cpl?v.leads*v.cpl*tx:null;
 }else{
  var media=v.invest!=null?v.invest/tx:null;
  v.sales=v.leads&&c?v.leads*c:null;
  v.cpl=media!=null&&v.leads?media/v.leads:null;
  v.result=v.sales!=null&&v.ticket?v.sales*v.ticket:null;
 }
}
function build(){
 var g=$("grid");g.innerHTML="";
 KPI.forEach(function(d,i){
  var key=(S.mode==="result"&&d.k==="result")||(S.mode==="budget"&&d.k==="invest");
  var c=document.createElement("div");c.className="card"+(key?" key":"");c.style.animationDelay=(i*70)+"ms";
  var unit=d.t==="money"?"R$":d.t==="pct"?"%":"";
  c.innerHTML='<div class="top"><h3>'+d.n+'</h3></div>'+
   '<div class="body"><div class="val"><span class="u">'+(d.t==="money"?unit:"")+'</span><input data-k="'+d.k+'" type="text" inputmode="decimal" placeholder="0" autocomplete="off" aria-label="'+d.n+'">'+(d.t==="pct"?'<span class="u">%</span>':"")+'</div>'+
   
   (d.k==="invest"?'<div class="tax"><label class="sw"><input type="checkbox" id="taxOn" aria-label="Incluir imposto"><i></i></label><span id="taxLbl"></span></div>':"")+'</div>';
  g.appendChild(c);
 });
 $("taxOn").checked=S.taxOn;
 $("taxOn").onchange=function(){S.taxOn=this.checked;calc();save();paint();};
 g.querySelectorAll("input[data-k]").forEach(function(el){
  var k=el.dataset.k;
  el.addEventListener("input",function(){
   var n=parse(el.value);
   S.v[k]=n==null?null:n*factor(k);
   calc();save();paint(k);
  });
  el.addEventListener("blur",function(){paint()});
 });
 paint();
}
function paint(skip){
 var typ={};KPI.forEach(function(d){typ[d.k]=d});
 document.querySelectorAll("input[data-k]").forEach(function(el){
  var k=el.dataset.k,d=typ[k],inp=isIn(k),key=(S.mode==="result"&&k==="result")||(S.mode==="budget"&&k==="invest");
  el.readOnly=!inp;
  el.placeholder="0";
  if(k===skip)return;
  var x=S.v[k];x=x==null?null:x/factor(k);
  var nv=f(x,d.t);
  if(el.value!==nv&&nv!==""&&el.readOnly){el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash")}
  el.value=nv;
 });
 $("taxLbl").textContent=S.taxOn?"Imposto incluso ("+f(S.taxRate,"pct")+"%)":"Imposto desativado";
 $("sub").textContent=(S.mode==="result"?"Meta de Resultado":"Meta de Or\u00e7amento")+" - "+(S.per==="week"?"Semanal":"Mensal");
 $("hint").textContent=S.mode==="result"
  ?"Digite Resultado, Ticket-M\u00e9dio, Convers\u00e3o e Custo por Lead. Vendas, Leads e Valor do Investimento s\u00e3o calculados automaticamente."
  :"Digite Valor do Investimento, Ticket-M\u00e9dio, Convers\u00e3o e Leads. Vendas, Custo por Lead e Resultado s\u00e3o calculados automaticamente.";
 document.querySelectorAll("#modeSeg button").forEach(function(b){b.classList.toggle("on",b.dataset.mode===S.mode)});
 document.querySelectorAll("#perSeg button").forEach(function(b){b.classList.toggle("on",b.dataset.per===S.per)});
}
function applyTheme(){
 var r=document.documentElement;
 if(S.theme)r.setAttribute("data-theme",S.theme);else r.removeAttribute("data-theme");
 var cur=S.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
 document.querySelectorAll("#themeSeg button").forEach(function(b){b.classList.toggle("on",b.dataset.theme===cur)});
 var c=COLORS[S.accent];r.style.setProperty("--accent",c[1]);r.style.setProperty("--on",c[2]);
 document.querySelectorAll("#cols button").forEach(function(b,i){b.classList.toggle("on",i===S.accent)});
}
COLORS.forEach(function(c,i){
 var b=document.createElement("button");b.style.background=c[1];b.title=c[0];b.setAttribute("aria-label",c[0]);
 b.onclick=function(){S.accent=i;save();applyTheme()};$("cols").appendChild(b);
});
document.querySelectorAll("#themeSeg button").forEach(function(b){b.onclick=function(){S.theme=b.dataset.theme;save();applyTheme()}});
document.querySelectorAll("#modeSeg button").forEach(function(b){b.onclick=function(){S.mode=b.dataset.mode;S.v={ticket:S.v.ticket,conv:S.v.conv};save();build()}});
document.querySelectorAll("#perSeg button").forEach(function(b){b.onclick=function(){S.per=b.dataset.per;save();build()}});
$("client").value=S.client;
$("client").addEventListener("input",function(){S.client=this.value;save()});
$("taxRate").value=String(S.taxRate).replace(".",",");
$("taxRate").addEventListener("input",function(){var n=parse(this.value);S.taxRate=n==null?0:n;calc();save();paint()});
function cfg(o){$("cfg").classList.toggle("open",o);$("scrim").classList.toggle("open",o);$("cfg").setAttribute("aria-hidden",!o)}
$("openCfg").onclick=function(){cfg(true)};$("closeCfg").onclick=function(){cfg(false)};$("scrim").onclick=function(){cfg(false)};
document.addEventListener("keydown",function(e){if(e.key==="Escape")cfg(false)});
calc();applyTheme();build();

var dl=null;
if(window.claude&&claude.use){claude.use("downloads").then(function(d){dl=d}).catch(function(){})}
function rr(c,x,y,w,h,q){c.beginPath();c.moveTo(x+q,y);c.arcTo(x+w,y,x+w,y+h,q);c.arcTo(x+w,y+h,x,y+h,q);c.arcTo(x,y+h,x,y,q);c.arcTo(x,y,x+w,y,q);c.closePath()}
function lines(c,t,mw){var w=t.split(" "),o=[],l="";w.forEach(function(x){var n=l?l+" "+x:x;if(c.measureText(n).width>mw&&l){o.push(l);l=x}else l=n});if(l)o.push(l);return o}
function msg(t){$("expMsg").textContent=t}
function draw(){
 var cs=getComputedStyle(document.documentElement),g=function(n){return cs.getPropertyValue(n).trim()};
 var bg=g("--bg"),pn=g("--panel"),tx=g("--text"),mu=g("--muted"),ac=g("--accent"),on=g("--on");
 var W=1600,P=64,gap=24,cw=(W-P*2-gap*3)/4,ch=170,th=82,H=770;
 var cv=document.createElement("canvas");cv.width=W;cv.height=H;var c=cv.getContext("2d");
 c.fillStyle=bg;c.fillRect(0,0,W,H);
 [[0,0,W*.55],[W,H,W*.5]].forEach(function(o){var gr=c.createRadialGradient(o[0],o[1],0,o[0],o[1],o[2]);gr.addColorStop(0,ac);gr.addColorStop(1,bg);c.globalAlpha=.4;c.fillStyle=gr;c.fillRect(0,0,W,H);c.globalAlpha=1});
 c.textBaseline="alphabetic";c.textAlign="left";
 c.save();c.translate(0,-60);
 c.textAlign="center";
 var name=S.client||"Cliente",fs=72;
 do{c.font='600 '+fs+'px Rubik,Arial,sans-serif';fs-=2}while(c.measureText(name).width>W-P*2&&fs>24);
 c.fillStyle=tx;c.fillText(name,W/2,210);
 c.fillStyle=ac;rr(c,W/2-60,232,120,6,3);c.fill();
 c.font='700 26px "Arial Rounded MT Bold",Arial,sans-serif';
 c.fillText((S.mode==="result"?"Meta de Resultado":"Meta de Or\u00e7amento")+" - "+(S.per==="week"?"Semanal":"Mensal"),W/2,290);
 KPI.forEach(function(d,i){
  var row=i<4?0:1,n=row?3:4,idx=row?i-4:i,x0=(W-(n*cw+(n-1)*gap))/2,x=x0+idx*(cw+gap),y=336+row*(ch+gap);
  var key=(S.mode==="result"&&d.k==="result")||(S.mode==="budget"&&d.k==="invest");
  c.save();c.shadowColor=ac;c.shadowBlur=key?40:22;c.fillStyle=pn;rr(c,x,y,cw,ch,22);c.fill();c.restore();
  c.save();rr(c,x,y,cw,ch,22);c.clip();
  c.fillStyle=ac;c.fillRect(x,y,cw,th);
  var gr=c.createLinearGradient(x,y,x+cw,y);gr.addColorStop(0,"rgba(255,255,255,0)");gr.addColorStop(1,"rgba(255,255,255,.4)");c.fillStyle=gr;c.fillRect(x,y,cw,th);
  c.restore();
  c.strokeStyle=ac;c.lineWidth=key?4:2;rr(c,x,y,cw,ch,22);c.stroke();
  c.textAlign="left";c.fillStyle=on;c.font='700 28px "Arial Rounded MT Bold",Arial,sans-serif';
  var ls=lines(c,d.n,cw-40),ty=y+th/2-(ls.length-1)*17+9;
  ls.forEach(function(l,j){c.fillText(l,x+22,ty+j*34)});
  var v=S.v[d.k],t="-";
  if(v!=null){v=v/factor(d.k);t=f(v,d.t);if(d.t==="money")t="R$ "+t;if(d.t==="pct")t+="%"}
  var vs=46;do{c.font='400 '+vs+'px "Arial Rounded MT Bold",Arial,sans-serif';vs-=2}while(c.measureText(t).width>cw-44&&vs>16);
  c.fillStyle=tx;c.fillText(t,x+22,y+th+(ch-th)/2+vs*.35);
 });
 c.restore();
 c.font='400 22px "Arial Rounded MT Bold",Arial,sans-serif';c.fillStyle=mu;c.textAlign="left";
 c.fillText(S.taxOn?"Imposto incluso no investimento ("+f(S.taxRate,"pct")+"%)":"Imposto n\u00e3o considerado",P,H-44);
 c.textAlign="right";c.fillText(new Date().toLocaleDateString("pt-BR"),W-P,H-44);
 return cv;
}
function pdf(by,w,h){
 var en=new TextEncoder(),parts=[],off=0,xr=[];
 function add(x){var b=typeof x==="string"?en.encode(x):x;parts.push(b);off+=b.length}
 function obj(n,b){xr[n]=off;add(n+" 0 obj\n"+b+"\nendobj\n")}
 var pw=w*.75,ph=h*.75,ct="q "+pw+" 0 0 "+ph+" 0 0 cm /Im0 Do Q";
 add("%PDF-1.4\n");
 obj(1,"<</Type/Catalog/Pages 2 0 R>>");
 obj(2,"<</Type/Pages/Kids[3 0 R]/Count 1>>");
 obj(3,"<</Type/Page/Parent 2 0 R/MediaBox[0 0 "+pw+" "+ph+"]/Resources<</XObject<</Im0 4 0 R>>>>/Contents 5 0 R>>");
 xr[4]=off;add("4 0 obj\n<</Type/XObject/Subtype/Image/Width "+w+"/Height "+h+"/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length "+by.length+">>\nstream\n");add(by);add("\nendstream\nendobj\n");
 obj(5,"<</Length "+ct.length+">>\nstream\n"+ct+"\nendstream");
 var xo=off,x="xref\n0 6\n0000000000 65535 f \n";
 for(var i=1;i<=5;i++)x+=String(xr[i]).padStart(10,"0")+" 00000 n \n";
 add(x+"trailer\n<</Size 6/Root 1 0 R>>\nstartxref\n"+xo+"\n%%EOF");
 return new Blob(parts,{type:"application/pdf"});
}
function saveBlob(b,fn,say){
 var bad="Exporta\u00e7\u00e3o indispon\u00edvel nesta visualiza\u00e7\u00e3o.";
 if(dl){dl.save({filename:fn,data:b}).then(function(){say("Arquivo exportado.")}).catch(function(e){say(e&&e.code==="declined"?"":bad)})}
 else if(window.claude){say(bad)}
 else{var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=fn;document.body.appendChild(a);a.click();a.remove();say("Arquivo exportado.")}
}
function slug(){return (S.client||"cliente").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"cliente"}
function withFonts(cb){document.fonts.load("600 40px Rubik").catch(function(){}).then(cb)}
$("expPng").onclick=function(){msg("Gerando imagem...");withFonts(function(){draw().toBlob(function(b){if(!b){msg("N\u00e3o foi poss\u00edvel gerar a imagem.");return}saveBlob(b,"okr-"+slug()+".png",msg)},"image/png")})};
$("expPdf").onclick=function(){msg("Gerando PDF...");withFonts(function(){var cv=draw(),bin=atob(cv.toDataURL("image/jpeg",.95).split(",")[1]),by=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)by[i]=bin.charCodeAt(i);saveBlob(pdf(by,cv.width,cv.height),"okr-"+slug()+".pdf",msg)})};

/* ===== Acompanhamento ===== */
var TU={money:"R$",pct:"%",num:"un."};
function tk(mo,wk,k){return wk?"w"+mo+"_"+wk+"_"+k:"m"+mo+"_"+k}
function segs(){document.querySelectorAll("#divSeg button").forEach(function(b){b.classList.toggle("on",b.dataset.div===S.div)})}
function tabs(){
 var t=$("tabs");t.innerHTML="";
 for(var m=1;m<=12;m++){(function(m){
  var b=document.createElement("button");b.className="tab"+(S.tab===m?" on":"");b.textContent="M\u00eas "+m;b.setAttribute("role","tab");
  b.onclick=function(){S.tab=m;save();[].forEach.call(t.children,function(x,i){x.classList.toggle("on",i+1===m)});table();chart()};
  t.appendChild(b)})(m)}
}
function table(){
 var wk=S.div==="week",cols=wk?[1,2,3,4]:[0],h="<thead><tr><th>KPI</th>";
 cols.forEach(function(c){h+="<th>"+(wk?"Semana "+c:"M\u00eas "+S.tab)+"</th>"});
 h+="</tr></thead><tbody>";
 KPI.forEach(function(d){
  h+='<tr><th scope="row">'+d.n+"</th>";
  cols.forEach(function(c){h+='<td><label class="c"><input data-t="'+tk(S.tab,c,d.k)+'" type="text" inputmode="decimal" placeholder="-" autocomplete="off" aria-label="'+d.n+'"><span class="u">'+TU[d.t]+"</span></label></td>"});
  h+="</tr>";
 });
 var t=$("tbl");t.innerHTML=h+"</tbody>";t.className=wk?"wk":"";
 t.querySelectorAll("input").forEach(function(el){
  var fit=function(){el.style.width=Math.max(el.value.length,2)+1+"ch";el.parentNode.classList.toggle("has",el.value.trim()!=="")};
  el.value=S.t[el.dataset.t]||"";fit();
  el.addEventListener("input",function(){S.t[el.dataset.t]=el.value;fit();save();chart(false)});
 });
}
function chart(anim){
 var k=S.chip,d=KPI.filter(function(x){return x.k===k})[0],wk=S.div==="week",n=wk?4:12,lab=[],val=[];
 for(var i=1;i<=n;i++){lab.push((wk?"S":"M")+i);var sv=wk?S.t[tk(S.tab,i,k)]:S.t[tk(i,0,k)];val.push(sv?parse(sv):null)}
 var chips=$("chips");chips.innerHTML="";
 KPI.forEach(function(x){var b=document.createElement("button");b.className="chip"+(x.k===k?" on":"");b.textContent=x.n;b.onclick=function(){S.chip=x.k;save();chart()};chips.appendChild(b)});
 $("ctitle").textContent="Progresso de "+d.n+" - "+(wk?"Semanas do M\u00eas "+S.tab:"Meses");
 var box=$("chart"),ok=val.filter(function(v){return v!=null});
 box.className="svgw"+(anim===false?" still":"");
 if(!ok.length){box.innerHTML='<p class="empty">Preencha a tabela para ver o progresso deste KPI.</p>';return}
 var W=800,H=300,L=78,R=24,T=24,B=44,pw=W-L-R,ph=H-T-B,mx=Math.max.apply(null,ok)*1.15||1;
 var X=function(i){return L+(n>1?i*pw/(n-1):0)},Y=function(v){return T+ph-v/mx*ph};
 var s='<svg viewBox="0 0 '+W+" "+H+'" role="img" aria-label="Gr\u00e1fico de progresso"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".45"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>';
 for(var g=0;g<=4;g++){var yy=T+ph-g*ph/4;s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--line)"/><text x="'+(L-10)+'" y="'+(yy+4)+'" text-anchor="end" font-size="10" fill="var(--muted)">'+f(mx*g/4,d.t==="pct"?"pct":"num")+"</text>"}
 lab.forEach(function(l,i){s+='<text x="'+X(i)+'" y="'+(H-14)+'" text-anchor="middle" font-size="10" fill="var(--muted)">'+l+"</text>"});
 var pts=[];val.forEach(function(v,i){if(v!=null)pts.push([X(i),Y(v),v,lab[i]])});
 var path=pts.map(function(q,i){return(i?"L":"M")+q[0]+" "+q[1]}).join(" "),last=pts[pts.length-1];
 s+='<path class="area" d="'+path+" L"+last[0]+" "+(T+ph)+" L"+pts[0][0]+" "+(T+ph)+' Z" fill="url(#ga)"/>';
 s+='<path class="ln" d="'+path+'" pathLength="1" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>';
 pts.forEach(function(q,i){s+='<circle class="dot" cx="'+q[0]+'" cy="'+q[1]+'" r="5" style="animation-delay:'+(0.9+i*0.06)+'s"><title>'+q[3]+": "+f(q[2],d.t)+"</title></circle>"});
 var nf=function(v){var t=v.toLocaleString("pt-BR",{maximumFractionDigits:2});return d.t==="money"?"R$ "+t:d.t==="pct"?t+"%":t};
 var sp=n>1?pw/(n-1):pw,ws=pts.map(function(q){return nf(q[2]).length*6.6+8}),wide=Math.max.apply(null,ws)>sp*.95;
 pts.forEach(function(q,i){
  var w=ws[i],h=14,below=wide&&i%2===1&&q[1]+46<T+ph,rx=Math.min(Math.max(q[0]-w/2,2),W-w-2),ry=below?q[1]+8:q[1]-8-h,px=Math.min(Math.max(q[0],rx+10),rx+w-10);
  var pg=below?px+","+(ry-5)+" "+(px-5)+","+ry+" "+(px+5)+","+ry:px+","+(ry+h+5)+" "+(px-5)+","+(ry+h)+" "+(px+5)+","+(ry+h);
  s+='<g class="tip" style="animation-delay:'+(1+i*.06)+'s"><text x="'+(rx+w/2)+'" y="'+(ry+h/2+4)+'" text-anchor="middle">'+nf(q[2])+"</text></g>";
 });
 box.innerHTML=s+"</svg>";
}
function csvq(v){v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function num1(sv){var n=sv?parse(sv):null;return n==null?"":n}
function csv(kind){
 var wk=kind==="week",rows=[(wk?["M\u00eas","Semana"]:["M\u00eas"]).concat(KPI.map(function(d){return d.n+" ("+TU[d.t]+")"}))];
 for(var m=1;m<=12;m++){
  if(wk){for(var w=1;w<=4;w++)rows.push(["M\u00eas "+m,"Semana "+w].concat(KPI.map(function(d){return num1(S.t[tk(m,w,d.k)])})))}
  else rows.push(["M\u00eas "+m].concat(KPI.map(function(d){return num1(S.t[tk(m,0,d.k)])})));
 }
 var txt="\uFEFF"+rows.map(function(r){return r.map(csvq).join(",")}).join("\r\n");
 saveBlob(new Blob([txt],{type:"text/csv"}),"okr-"+slug()+(wk?"-por-semana":"-por-mes")+".csv",function(t){$("csvMsg").textContent=t});
}
document.querySelectorAll("[data-csv]").forEach(function(b){b.onclick=function(){csv(b.dataset.csv)}});
document.querySelectorAll("#divSeg button").forEach(function(b){b.onclick=function(){S.div=b.dataset.div;save();segs();table();chart()}});
segs();tabs();table();chart();
})();
</script>
